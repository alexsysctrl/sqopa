<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQOPA</title>
<meta name="description" content="Projects kept here: a running world, an album, a music engine, a language-model study.">
<style>
/* The umbrella page. The mark carries the name, and everything below it is a project. No pitch, no
   paragraph, no figures: this is a table of what exists, in the order it belongs. */
:root{
  --ink:#0e0e0d; --paper:#f7f6f3; --meta:#918d86; --rule:#2b2a27;
  --serif:Charter,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.6 var(--serif);-webkit-text-size-adjust:100%}
header{padding:1.5rem 1.2rem 0}
header .in{max-width:34rem;margin:0 auto}
.brand img{width:92px;height:auto;display:block}
a.go{display:inline-block;margin-top:1.05rem;font:400 12px/1 var(--mono);letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper);text-decoration:none;border:1px solid var(--paper);padding:.7rem 1rem}
a.go:hover,a.go:active{background:var(--paper);color:var(--ink)}
main{max-width:34rem;margin:0 auto;padding:2.6rem 1.2rem 4rem}
.item{border-top:1px solid var(--rule);padding:1.5rem 0 1.7rem}
.item:first-child{border-top:0;padding-top:0}
h2{font:400 1.32rem/1.3 var(--serif);letter-spacing:-.01em;margin:0}
.item p{margin:.55rem 0 0;color:#cfc9bd}
a{color:var(--paper)}
footer{margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--rule);font:400 12px/1.7 var(--mono);color:var(--meta)}
@media (max-width:420px){main{padding:2rem 1.05rem 3rem}.brand img{width:78px}h2{font-size:1.2rem}}
</style>
</head>
<body>

<header><div class="in brand">
<img src="logo-white.png" alt="SQOPA">
<a class="go" href="mailto:justyouandmelol29@gmail.com">Contact</a>
</div></header>

<main>
<p style="color:var(--meta);font-size:14px;margin:0">Nothing is here yet. The projects get a page when they are said to be public.</p>
</main>
</body>
</html>
